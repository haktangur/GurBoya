services:
  web:
    image: gurboya-web:local
    build: .
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Host: db
      Database__Name: ${POSTGRES_DB:-gurboya}
      Database__User: gurboya_app
      Database__Password: ${APP_DB_PASSWORD:?APP_DB_PASSWORD tanimlayin}
    ports:
      - "127.0.0.1:${WEB_PORT:-5080}:8080"
    networks:
      - database
      - web
    depends_on:
      db:
        condition: service_healthy

  migrate:
    image: gurboya-web:local
    build: .
    profiles: [tools]
    command: ["--migrate"]
    environment:
      Database__Host: db
      Database__Name: ${POSTGRES_DB:-gurboya}
      Database__User: gurboya_migrator
      Database__Password: ${MIGRATION_DB_PASSWORD:?MIGRATION_DB_PASSWORD tanimlayin}
    networks:
      - database
    depends_on:
      db:
        condition: service_healthy

  db-setup:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    profiles: [tools]
    entrypoint: ["sh", "/setup/setup.sh"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-gurboya}
      PGUSER: ${POSTGRES_USER:-gurboya_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanimlayin}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD tanimlayin}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?MIGRATION_DB_PASSWORD tanimlayin}
    volumes:
      - ./scripts/db:/setup:ro
    networks:
      - database
    depends_on:
      db:
        condition: service_healthy

networks:
  web:
