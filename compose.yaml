name: gurboya

services:
  db:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gurboya}
      POSTGRES_USER: ${POSTGRES_USER:-gurboya_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Yerel .env dosyasinda POSTGRES_PASSWORD tanimlayin}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      # PostgreSQL 18+: PGDATA is /var/lib/postgresql/18/docker.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - database

volumes:
  postgres_data:

networks:
  database:
    internal: true
